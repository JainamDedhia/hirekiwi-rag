version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirekiwi-rag-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=HireKiwi-CRAG
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=groq
      - GROQ_MODEL=openai/gpt-oss-120b
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_PROVIDER=sentence-transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - SAMPLE_DOCS_DIR=/app/data/sample_documents
      - DATA_DIR=/app/data
      - RERANKING_ENABLED=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: hirekiwi-rag-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
